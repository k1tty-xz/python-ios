name: Build Python 3.14 for iOS (arm64) and package .deb

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    concurrency:
      group: ios-python3.14-arm64-${{ github.ref }}
      cancel-in-progress: true
    env:
      PY_VER: 3.14.7
      LIBFFI_VER: 3.8.0
      MPDECIMAL_VER: 4.0.1
      OPENSSL_VER: 3.6.4
      PACKAGE_REVISION: 7
      MIN_IOS: 14.5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Discover SDK version
        id: sdk
        run: |
          echo "version=$(xcrun --sdk iphoneos --show-sdk-version)" >> "$GITHUB_OUTPUT"

      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: |
            work/deps/openssl-ios
            work/deps/libffi-ios
            work/deps/mpdecimal-ios
          key: ios-${{ runner.os }}-sdk-${{ steps.sdk.outputs.version }}-openssl-${{ env.OPENSSL_VER }}-libffi-${{ env.LIBFFI_VER }}-mpdecimal-${{ env.MPDECIMAL_VER }}-hash-${{ hashFiles('scripts/**', '.github/workflows/python-ios-arm64.yml') }}
          restore-keys: |
            ios-${{ runner.os }}-sdk-${{ steps.sdk.outputs.version }}-openssl-${{ env.OPENSSL_VER }}-libffi-${{ env.LIBFFI_VER }}-mpdecimal-${{ env.MPDECIMAL_VER }}-
            ios-${{ runner.os }}-sdk-${{ steps.sdk.outputs.version }}-

      - name: Install build tools
        run: bash scripts/install-build-tools.sh

      - name: Set up host Python
        id: py
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PY_VER }}

      - name: Build and package
        run: |
          set -euo pipefail
          PYTHON_FOR_BUILD="${{ steps.py.outputs.python-path }}" make all

      - name: Validate package
        run: |
          set -euo pipefail
          package="work/python3.14_${PY_VER}-${PACKAGE_REVISION}_iphoneos-arm.deb"
          verify_dir="work/package-verify"
          test -f "$package"
          test "$(dpkg-deb --field "$package" Architecture)" = "iphoneos-arm"
          test "$(dpkg-deb --field "$package" Version)" = "${PY_VER}-${PACKAGE_REVISION}"
          rm -rf "$verify_dir"
          mkdir -p "$verify_dir"
          dpkg-deb --extract "$package" "$verify_dir"
          test -x "$verify_dir/usr/local/bin/python${PY_VER%.*}"
          test -x "$verify_dir/usr/local/bin/python3"
          while IFS= read -r -d '' file_path; do
            description="$(file -b "$file_path")"
            if [[ "$description" == *Mach-O* ]]; then
              [[ "$description" == *arm64* ]]
            fi
          done < <(find "$verify_dir" -type f -print0)

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: python3.14_${{ env.PY_VER }}-${{ env.PACKAGE_REVISION }}_iphoneos-arm
          path: work/python3.14_${{ env.PY_VER }}-${{ env.PACKAGE_REVISION }}_iphoneos-arm.deb
