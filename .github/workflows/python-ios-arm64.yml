name: Build Python 3.14 for iOS (arm64)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PY_VER: 3.14.7
  LIBFFI_VER: 3.8.0
  OPENSSL_VER: 3.5.8
  PACKAGE_REVISION: 1
  MIN_IOS: 14.5

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up host Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PY_VER }}
          check-latest: true

      - name: Install build tools
        run: brew install dpkg pkg-config shellcheck

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: work/deps
          key: ${{ runner.os }}-${{ runner.arch }}-${{ env.PY_VER }}-${{ env.LIBFFI_VER }}-${{ env.OPENSSL_VER }}-${{ hashFiles('scripts/common-env.sh') }}

      - name: Configure host Python
        run: echo "PYTHON_FOR_BUILD=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Check shell scripts
        run: |
          bash -n scripts/*.sh
          shellcheck -x -P SCRIPTDIR scripts/*.sh

      - name: Build package
        run: make package

      - name: Validate package
        run: make validate

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: python3.14-ios-arm64
          path: work/python3.14_*.deb
          if-no-files-found: error
