name: Build Python for jailbroken iOS

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install packaging tools
        run: brew install dpkg ldid
      - name: Identify SDK
        id: sdk
        run: echo "version=$(xcrun --sdk iphoneos --show-sdk-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6.1.0
        id: cache
        with:
          path: |
            .build/host
            .build/deps
          key: ios14-v1-${{ runner.arch }}-${{ steps.sdk.outputs.version }}-${{ hashFiles('sources.lock') }}
      - name: Build
        run: bash build.sh
      - uses: actions/cache/save@v6.1.0
        if: always() && steps.cache.outputs.cache-hit != 'true' && hashFiles('.build/deps/.complete') != ''
        with:
          path: |
            .build/host
            .build/deps
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Upload package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-rootful-arm64
          path: dist/*
          if-no-files-found: error
      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-logs
          include-hidden-files: true
          path: |
            .build/**/config.log
            .build/**/pyconfig.h
            .build/**/Makefile
