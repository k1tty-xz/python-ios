name: Build rootful package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yml

permissions:
  contents: read

jobs:
  rootful:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PYTHON_VERSION: 3.14.7
      PYTHON_SHA256: 3b48dac8fb59f62eaa67ac83c1eb12bda1b7a08406dd286e252c11a66be27f81
      PACKAGE: python3.14_3.14.7-1_iphoneos-arm_rootful.deb

    steps:
      - name: Select toolchain
        run: |
          set -euxo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          test "$(uname -m)" = arm64
          xcrun --sdk iphoneos --show-sdk-path

      - name: Download CPython
        run: |
          set -euxo pipefail
          archive="Python-${PYTHON_VERSION}.tar.xz"
          curl --fail --location --retry 5 --output "$archive" \
            "https://www.python.org/ftp/python/${PYTHON_VERSION}/${archive}"
          printf '%s  %s\n' "$PYTHON_SHA256" "$archive" | shasum -a 256 --check
          tar -xf "$archive"

      - name: Build CPython for iOS
        working-directory: Python-${{ env.PYTHON_VERSION }}
        run: |
          set -euxo pipefail
          python3 Apple build iOS build --clean
          python3 Apple build iOS arm64-apple-ios -- \
            --with-ensurepip=no \
            LDFLAGS=-Wl,-rpath,/usr/lib

      - name: Assemble rootful filesystem
        working-directory: Python-${{ env.PYTHON_VERSION }}
        run: |
          set -euxo pipefail
          prefix="cross-build/arm64-apple-ios/Apple/iOS/Frameworks/arm64-iphoneos"
          executable="cross-build/arm64-apple-ios/python.exe"
          stage="$GITHUB_WORKSPACE/stage"

          if test ! -f "$executable"; then
            executable="cross-build/arm64-apple-ios/python"
          fi

          test -f "$executable"
          test -f "$prefix/Python.framework/Python"
          test -f "$prefix/lib/python3.14/os.py"
          test -d "$prefix/lib/python3.14/lib-dynload"

          mkdir -p "$stage/DEBIAN" "$stage/usr/bin" "$stage/usr/lib" \
            "$stage/usr/share/doc/python3.14"
          cp -p "$executable" "$stage/usr/bin/python3.14"
          ln -s python3.14 "$stage/usr/bin/python3"
          ditto "$prefix/Python.framework" "$stage/usr/lib/Python.framework"
          ditto "$prefix/lib/python3.14" "$stage/usr/lib/python3.14"
          ln -s Python.framework/Python "$stage/usr/lib/libpython3.14.dylib"
          cp -p LICENSE "$stage/usr/share/doc/python3.14/LICENSE"

          find "$stage/usr/lib/python3.14/lib-dynload" -type f -name '*.so' \
            -exec codesign --force --sign - --timestamp=none {} \;
          codesign --force --sign - --timestamp=none \
            "$stage/usr/lib/Python.framework"
          codesign --force --sign - --timestamp=none \
            "$stage/usr/bin/python3.14"

          installed_size="$(du -sk "$stage/usr" | awk '{print $1}')"
          cat > "$stage/DEBIAN/control" <<EOF
          Package: python3.14
          Name: Python 3.14
          Version: ${PYTHON_VERSION}-1
          Architecture: iphoneos-arm
          Maintainer: k1tty-xz <187893856+k1tty-xz@users.noreply.github.com>
          Installed-Size: ${installed_size}
          Section: Development
          Priority: optional
          Description: CPython ${PYTHON_VERSION} for rootful jailbroken iOS
          EOF

      - name: Validate target and package contents
        run: |
          set -euxo pipefail
          stage="$GITHUB_WORKSPACE/stage"
          count=0

          while IFS= read -r -d '' item; do
            if file "$item" | grep -q 'Mach-O'; then
              xcrun lipo "$item" -verify_arch arm64
              xcrun vtool -show-build "$item" | grep 'platform IOS'
              codesign --verify --strict "$item"
              count=$((count + 1))
            fi
          done < <(find "$stage/usr" -type f -print0)

          test "$count" -gt 1
          otool -L "$stage/usr/bin/python3.14" | \
            grep -F '@rpath/Python.framework/Python'
          otool -l "$stage/usr/bin/python3.14" | grep -A2 LC_RPATH | \
            grep -F 'path /usr/lib'
          test -f "$stage/usr/lib/python3.14/encodings/__init__.py"
          test "$(find "$stage/usr/lib/python3.14/lib-dynload" -name '*.so' | wc -l)" -gt 0
          test ! -e "$stage/usr/bin/pip3"

          brew install dpkg
          mkdir -p "$GITHUB_WORKSPACE/dist"
          dpkg-deb --build --root-owner-group "$stage" \
            "$GITHUB_WORKSPACE/dist/$PACKAGE"
          dpkg-deb --info "$GITHUB_WORKSPACE/dist/$PACKAGE"
          dpkg-deb --contents "$GITHUB_WORKSPACE/dist/$PACKAGE"

      - name: Upload .deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PACKAGE }}
          path: dist/${{ env.PACKAGE }}
          archive: false
          if-no-files-found: error
