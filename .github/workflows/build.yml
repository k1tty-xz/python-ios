name: Build rootful package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build.yml
      - patches/cpython-ios-jailbreak.patch

concurrency:
  group: rootful-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  rootful:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PYTHON_VERSION: 3.14.7
      PYTHON_SHA256: 3b48dac8fb59f62eaa67ac83c1eb12bda1b7a08406dd286e252c11a66be27f81
      PACKAGE_VERSION: 3.14.7-8
      IOS_HOST: arm64-apple-ios
      IOS_MULTIARCH: arm64-iphoneos
      DEB_NAME: python3.14_3.14.7-8_iphoneos-arm_rootful.deb

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build CPython
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

          archive="Python-${PYTHON_VERSION}.tar.xz"
          curl -fsSL --retry 5 -o "$archive" \
            "https://www.python.org/ftp/python/${PYTHON_VERSION}/${archive}"
          printf '%s  %s\n' "$PYTHON_SHA256" "$archive" | shasum -a 256 --check
          tar -xf "$archive"
          cd "Python-${PYTHON_VERSION}"

          patch --forward --strip=1 \
            < "$GITHUB_WORKSPACE/patches/cpython-ios-jailbreak.patch"
          python3 Apple build iOS build --clean
          sudo -n env DEVELOPER_DIR="$DEVELOPER_DIR" PATH="$PATH" \
            DESTDIR="$PWD/cross-build/$IOS_HOST/" \
            python3 Apple build iOS "$IOS_HOST" -- \
            --with-ensurepip=install \
            LDFLAGS=-Wl,-rpath,/usr/lib

          prefix="cross-build/${IOS_HOST}/Apple/iOS/Frameworks/${IOS_MULTIARCH}"
          compiler="$PWD/Apple/iOS/Resources/bin/${IOS_HOST}-clang"
          IPHONEOS_DEPLOYMENT_TARGET=13.0 "$compiler" \
            -std=c11 -Wall -Wextra -Werror \
            -I "$prefix/Python.framework/Headers" \
            -F "$prefix" \
            Programs/python.c \
            -framework Python \
            -Wl,-rpath,/usr/lib \
            -o "$GITHUB_WORKSPACE/python3.14"

      - name: Assemble package
        working-directory: Python-${{ env.PYTHON_VERSION }}
        run: |
          set -euo pipefail
          prefix="cross-build/${IOS_HOST}/Apple/iOS/Frameworks/${IOS_MULTIARCH}"
          stage="$GITHUB_WORKSPACE/stage"

          test -f "$GITHUB_WORKSPACE/python3.14"
          test -f "$prefix/Python.framework/Python"
          test -f "$prefix/lib/python3.14/os.py"
          test -f "$prefix/lib/python3.14/lib-dynload/_posixsubprocess.cpython-314-iphoneos.so"

          mkdir -p "$stage/DEBIAN" "$stage/usr/bin" "$stage/usr/lib" \
            "$stage/usr/share/doc/python3.14"
          cp -p "$GITHUB_WORKSPACE/python3.14" "$stage/usr/bin/python3.14"
          ln -s python3.14 "$stage/usr/bin/python3"
          ditto "$prefix/Python.framework" "$stage/usr/lib/Python.framework"
          ditto "$prefix/lib/python3.14" "$stage/usr/lib/python3.14"
          ln -s Python.framework/Python "$stage/usr/lib/libpython3.14.dylib"
          cp -p LICENSE "$stage/usr/share/doc/python3.14/LICENSE"

          find "$stage/usr/lib/python3.14/lib-dynload" -name '*.so' \
            -exec codesign --force --sign - --timestamp=none {} \;
          codesign --force --sign - --timestamp=none "$stage/usr/lib/Python.framework"
          codesign --force --sign - --timestamp=none "$stage/usr/bin/python3.14"

          installed_size="$(du -sk "$stage/usr" | awk '{print $1}')"
          cat > "$stage/DEBIAN/control" <<EOF
          Package: python3.14
          Version: ${PACKAGE_VERSION}
          Architecture: iphoneos-arm
          Maintainer: k1tty-xz <187893856+k1tty-xz@users.noreply.github.com>
          Installed-Size: ${installed_size}
          Section: Development
          Priority: optional
          Description: CPython ${PYTHON_VERSION} for rootful jailbroken iOS
          EOF

          cat > "$stage/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -eu

          case "${1:-}" in
            configure)
              printf '%s\n' \
                '╭────────────────────────────────────────╮' \
                '│  CPython 3.14.7 is ready                │' \
                '╰────────────────────────────────────────╯' \
                '  Run      python3' \
                '  pip      python3 -m pip' \
                '  Prefix   /usr' \
                '  Target   arm64 iOS · rootful'
              ;;
          esac
          EOF
          chmod 755 "$stage/DEBIAN/postinst"

          cat > "$stage/DEBIAN/postrm" <<'EOF'
          #!/bin/sh
          set -eu

          case "${1:-}" in
            remove|purge)
              printf '%s\n' \
                '╭────────────────────────────────────────╮' \
                '│  CPython 3.14 removed                  │' \
                '╰────────────────────────────────────────╯' \
                '  User-installed packages were kept.'
              ;;
          esac
          EOF
          chmod 755 "$stage/DEBIAN/postrm"

      - name: Validate package
        run: |
          set -euo pipefail
          stage="$GITHUB_WORKSPACE/stage"

          check_macho() {
            xcrun lipo "$1" -verify_arch arm64
            xcrun vtool -show-build "$1" | grep -F 'platform IOS'
            codesign --verify --strict "$1"
          }

          check_macho "$stage/usr/bin/python3.14"
          check_macho "$stage/usr/lib/Python.framework/Python"
          while IFS= read -r -d '' extension; do
            check_macho "$extension"
          done < <(find "$stage/usr/lib/python3.14/lib-dynload" -name '*.so' -print0)

          otool -L "$stage/usr/bin/python3.14" | grep -F '@rpath/Python.framework/Python'
          otool -l "$stage/usr/bin/python3.14" | grep -A2 LC_RPATH | grep -F 'path /usr/lib'
          nm -u "$stage/usr/bin/python3.14" | grep -F '_Py_BytesMain'
          test -f "$stage/usr/lib/python3.14/encodings/__init__.py"
          test -f "$stage/usr/lib/python3.14/lib-dynload/_posixsubprocess.cpython-314-iphoneos.so"
          test -f "$stage/usr/lib/python3.14/site-packages/pip/__main__.py"
          test "$(find "$stage/usr/lib/python3.14/site-packages" -maxdepth 1 -name 'pip-*.dist-info' | wc -l)" -eq 1
          sh -n "$stage/DEBIAN/postinst"
          sh -n "$stage/DEBIAN/postrm"

          brew install dpkg
          mkdir -p dist
          dpkg-deb --build --root-owner-group "$stage" "dist/$DEB_NAME"
          test "$(dpkg-deb --field "dist/$DEB_NAME" Package)" = python3.14
          test "$(dpkg-deb --field "dist/$DEB_NAME" Version)" = "$PACKAGE_VERSION"
          test "$(dpkg-deb --field "dist/$DEB_NAME" Architecture)" = iphoneos-arm
          dpkg-deb --info "dist/$DEB_NAME"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/${{ env.DEB_NAME }}
          archive: false
          if-no-files-found: error
