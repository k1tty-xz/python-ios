name: Build CPython framework for iOS

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian packaging tools
        run: brew install dpkg
      - name: Build package
        run: ./scripts/build.sh
      - name: Verify package
        run: ./scripts/test.sh dist/python-ios-framework_3.14.7-1_iphoneos-arm64.deb
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: python-ios-framework
          path: dist/*.deb
