name: Build iOS Frida Python binding

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/frida-build.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  FRIDA_VERSION: 17.17.0
  FRIDA_DEVKIT_SHA256: 699dcb9e76a6c7ef8f4b6f5088bb899f30ffd227a2913fe904f13ec83ac3593e
  CPYTHON_ARTIFACT_PATTERN: ^python3\.14_.+_iphoneos-arm_rootful\.deb$
  PACKAGE_VERSION: 17.17.0-1
  DEB_NAME: python3.14-frida_17.17.0-1_iphoneos-arm64.deb

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install packaging tools
        run: brew install dpkg pkg-config vala

      - name: Get CPython target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cpython"
          mkdir -p "$work"

          artifact="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            | jq -cer --arg pattern "$CPYTHON_ARTIFACT_PATTERN" \
              '[.artifacts[] | select(.expired == false and (.name | test($pattern)))]
               | sort_by(.updated_at) | last')"

          id="$(jq -r .id <<<"$artifact")"
          name="$(jq -r .name <<<"$artifact")"
          digest="$(jq -r .digest <<<"$artifact")"
          package="$work/$name"

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$package" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip"
          test "$digest" = "sha256:$(shasum -a 256 "$package" | cut -d ' ' -f 1)"

          dpkg-deb -x "$package" "$work/root"
          test -f "$work/root/usr/lib/Python.framework/Python"
          test -f "$work/root/usr/lib/Python.framework/Headers/Python.h"
          printf 'CPYTHON_ROOT=%s\n' "$work/root" >> "$GITHUB_ENV"

      - name: Build Frida Python binding
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/frida"
          git clone --depth 1 --branch "$FRIDA_VERSION" --recurse-submodules \
            https://github.com/frida/frida-python.git "$work/source"

          devkit="$work/devkit"
          archive="$work/devkit.tar.xz"
          curl -fsSL --retry 5 -o "$archive" \
            "https://github.com/frida/frida/releases/download/$FRIDA_VERSION/frida-core-devkit-$FRIDA_VERSION-ios-arm64.tar.xz"
          printf '%s  %s\n' "$FRIDA_DEVKIT_SHA256" "$archive" | shasum -a 256 --check
          mkdir -p "$devkit"
          tar -xf "$archive" --strip-components=1 -C "$devkit"

          python3 -m venv "$work/venv"
          "$work/venv/bin/python" -m pip install --disable-pip-version-check setuptools

          export PATH="$work/venv/bin:$PATH"
          export PKG_CONFIG_PATH="$devkit/lib/pkgconfig"
          export CFLAGS="-I$CPYTHON_ROOT/usr/lib/Python.framework/Headers"
          export LDFLAGS="-F$CPYTHON_ROOT/usr/lib -Wl,-rpath,/usr/lib -framework Python"
          export PYTHON="$work/venv/bin/python"

          cd "$work/source"
          ./configure --host=ios-arm64 --without-prebuilds=toolchain,sdk:build,sdk:host
          make -j"$(sysctl -n hw.ncpu)"

          generated="$work/source/build/frida"
          test -f "$generated/__init__.py"
          test -f "$generated/aio.py"
          extension="$(find "$generated" -maxdepth 1 -name '_frida*.so' -type f -print -quit)"
          test -n "$extension"
          printf 'FRIDA_GENERATED=%s\nFRIDA_EXTENSION=%s\n' "$generated" "$extension" >> "$GITHUB_ENV"

      - name: Assemble package
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage"
          site="$stage/usr/lib/python3.14/site-packages/frida"
          mkdir -p "$stage/DEBIAN" "$site"

          cp -p "$FRIDA_GENERATED/__init__.py" "$FRIDA_GENERATED/aio.py" \
            "$FRIDA_GENERATED/_frida.pyi" "$FRIDA_GENERATED/py.typed" "$site/"
          cp -p "$FRIDA_EXTENSION" "$site/"
          codesign --force --sign - --timestamp=none "$site/$(basename "$FRIDA_EXTENSION")"

          installed_size="$(du -sk "$stage/usr" | awk '{print $1}')"
          cat > "$stage/DEBIAN/control" <<EOF
          Package: python3.14-frida
          Version: ${PACKAGE_VERSION}
          Architecture: iphoneos-arm64
          Maintainer: k1tty-xz <187893856+k1tty-xz@users.noreply.github.com>
          Depends: python3.14
          Installed-Size: ${installed_size}
          Section: Python
          Priority: optional
          Description: Frida Python bindings for CPython 3.14 on jailbroken iOS
          EOF

          cat > "$stage/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -eu
          case "${1:-}" in
            configure)
              printf '%s\n' \
                '╭────────────────────────────────────────╮' \
                '│  Frida Python bindings are ready        │' \
                '╰────────────────────────────────────────╯' \
                '  Test     python3 -c "import frida; print(frida.__version__)"' \
                '  Runtime  install Frida from https://build.frida.re'
              ;;
          esac
          EOF
          chmod 755 "$stage/DEBIAN/postinst"

          cat > "$stage/DEBIAN/postrm" <<'EOF'
          #!/bin/sh
          set -eu
          case "${1:-}" in
            remove|purge) printf '%s\n' 'Frida Python bindings removed; user files were kept.' ;;
          esac
          EOF
          chmod 755 "$stage/DEBIAN/postrm"

          mkdir -p dist
          dpkg-deb --build --root-owner-group "$stage" "dist/$DEB_NAME"

      - name: Validate package
        run: |
          set -euo pipefail
          package="dist/$DEB_NAME"
          root="$RUNNER_TEMP/verify"
          dpkg-deb -x "$package" "$root"
          extension="$(find "$root/usr/lib/python3.14/site-packages/frida" -name '_frida*.so' -type f -print -quit)"
          xcrun lipo "$extension" -verify_arch arm64
          xcrun vtool -show-build "$extension" | grep -F 'platform IOS'
          codesign --verify --strict "$extension"
          test "$(dpkg-deb --field "$package" Package)" = python3.14-frida
          test "$(dpkg-deb --field "$package" Architecture)" = iphoneos-arm64
          sh -n "$RUNNER_TEMP/stage/DEBIAN/postinst"
          sh -n "$RUNNER_TEMP/stage/DEBIAN/postrm"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.DEB_NAME }}
          path: dist/${{ env.DEB_NAME }}
          archive: false
          if-no-files-found: error
